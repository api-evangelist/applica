name: Applica
description: >-
  Applica was an AI-based document understanding and text automation company
  founded in Warsaw, Poland, built on deep-learning research in natural language
  processing for unstructured documents. Its platform read, interpreted, and
  extracted information from documents such as invoices, contracts, insurance
  claims, legal documents, and financial filings across the finance, insurance,
  legal, and media industries. Applica went through the Barclays Accelerator
  powered by Techstars and raised a Series A led by Cogito Capital Partners in
  2020. Snowflake announced its intent to acquire Applica in August 2022 and
  absorbed the technology into the Snowflake platform. Applica no longer operates
  as an independent product or API provider, and applica.ai is no longer a live
  developer surface; this profile is retained for historical/network provenance.
